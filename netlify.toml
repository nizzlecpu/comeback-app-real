[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
  # The build runs `tsc && vite build`, so the TypeScript and Vite binaries from
  # devDependencies must be installed even when NODE_ENV is production.
  NPM_FLAGS = "--include=dev"
